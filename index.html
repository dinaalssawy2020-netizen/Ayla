<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title> إيلا  🌙</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Tajawal',sans-serif}
body{background:#0E0A14;min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow:hidden;position:relative}
.stars{position:fixed;inset:0;pointer-events:none}
.star{position:absolute;width:2px;height:2px;background:#FFD60A;border-radius:50%;animation:twinkle 2s infinite alternate}
@keyframes twinkle{0%{opacity:.2}100%{opacity:1}}
.moon{position:absolute;top:20px;left:20px;font-size:34px;filter:drop-shadow(0 0 12px #FFD60A)}
.header{width:100%;text-align:center;padding:28px 20px 10px;z-index:2}
.header h1{color:#FFD60A;font-size:30px;font-weight:900;text-shadow:0 0 18px #FFD60A}
.header p{color:#FFF2A8;font-size:13px;margin-top:4px;font-weight:800;opacity:.8}
.heart-wrap{margin-top:20px;position:relative;width:280px;height:280px;display:flex;align-items:center;justify-content:center;z-index:2}
.heart{width:170px;height:170px;background:#FFD60A;position:relative;transform:rotate(-45deg);animation:beat 1.2s infinite;box-shadow:0 0 20px #FFD60A, 0 0 40px #FFD60A, 0 0 0 6px #4E0F13;cursor:pointer}
.heart::before,.heart::after{content:"";width:170px;height:170px;background:#FFD60A;border-radius:50%;position:absolute;box-shadow:0 0 20px #FFD60A}
.heart::before{top:-85px;left:0}.heart::after{left:85px;top:0}
@keyframes beat{0%,100%{transform:rotate(-45deg) scale(1)}50%{transform:rotate(-45deg) scale(1.18)}}
.heart-text{position:absolute;z-index:3;transform:rotate(45deg);color:#4E0F13;font-weight:900;font-size:26px;text-align:center;top:32%;left:12%;width:76%}
.counter{margin-top:10px;background:rgba(255,214,10,.15);border:2px solid #FFD60A;border-radius:18px;padding:10px 18px;color:#FFD60A;font-weight:900;font-size:15px;box-shadow:0 0 16px rgba(255,214,10,.4);z-index:2}
.cards{width:90%;max-width:420px;margin:22px auto;z-index:2}
.card{background:rgba(255,255,255,.06);border:2px solid rgba(255,214,10,.5);border-radius:20px;padding:14px;margin-bottom:12px;text-align:center}
.card p{color:#FFEC99;font-weight:800;font-size:14px}
.btn{background:#FFD60A;color:#4E0F13;border:none;border-radius:14px;padding:11px 18px;font-weight:900;cursor:pointer;margin:4px;box-shadow:0 0 12px rgba(255,214,10,.6)}
.btn.dark{background:#4E0F13;color:#FFD60A;border:2px solid #FFD60A}
.floating{position:fixed;bottom:0;font-size:20px;animation:floatUp 3s forwards;pointer-events:none;z-index:10}
@keyframes floatUp{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-90vh);opacity:0}}
</style>
</head>
<body>
<div class="stars" id="stars"></div><div class="moon">🌙</div>
<div class="header"><h1>قلب إيلا بليل 🌙</h1><p>منور زي القمر - دوسي عليه بليل</p></div>
<div class="heart-wrap" onclick="love()"><div class="heart"><div class="heart-text">إيلا<br>💛</div></div></div>
<div class="counter">✨ <span id="num">0</span> نبضة بليل لإيلا</div>
<div class="cards">
<div class="card"><p id="msg">إيلا قمر بليل 🌙💛</p></div>
<div class="card">
<button class="btn" onclick="love()">💛 نوري قلب إيلا</button>
<button class="btn dark" onclick="changeMsg()">🌙 رسالة بليل</button>
</div>
</div>
<script>
let s=document.getElementById('stars');
for(let i=0;i<60;i++){let d=document.createElement('div');d.className='star';d.style.left=Math.random()*100+'vw';d.style.top=Math.random()*60+'vh';d.style.animationDelay=Math.random()*2+'s';s.appendChild(d);}
let n=parseInt(localStorage.getItem('aylaNight')||0);
let msgs=["إيلا قمر بليل 🌙💛","إيلا بتنور أوضتها زي النجمة ⭐","تصبحي على خير يا إيلا يا روحي 😴💛","حضن إيلا بيدفي بليل 🤗","نجمة إيلا منورة السما كلها ✨","إيلا حلم حلو بليل 🌙","ماما وبابا بيحبوا إيلا قد النجوم كلها 💛"];
let i=0;
document.getElementById('num').innerText=n;
function love(){
 n++;localStorage.setItem('aylaNight',n);document.getElementById('num').innerText=n;
 let e=document.createElement('div');e.className='floating';e.innerText=['💛','🌙','⭐','✨'][Math.floor(Math.random()*4)];e.style.left=Math.random()*80+10+'vw';e.style.bottom='10px';document.body.appendChild(e);setTimeout(()=>e.remove(),3000);
 try{let a=new AudioContext();let o=a.createOscillator();let g=a.createGain();o.frequency.setValueAtTime(180,a.currentTime);o.frequency.exponentialRampToValueAtTime(500,a.currentTime+.25);g.gain.setValueAtTime(.25,a.currentTime);g.gain.exponentialRampToValueAtTime(.01,a.currentTime+.4);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.5);}catch(e){}
 if(navigator.vibrate) navigator.vibrate(60);
}
function changeMsg(){i=(i+1)%msgs.length;document.getElementById('msg').innerText=msgs[i];love();}
</script>
</body>
  </html>
