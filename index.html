<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>قلب إيلا 🌙</title>
<meta name="theme-color" content="#4E0F13">
<link id="manifestLink" rel="manifest" href="">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Tajawal',sans-serif}
body{background:#0E0A14;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;position:relative;padding:20px 0}
.stars{position:fixed;inset:0;pointer-events:none}
.star{position:absolute;width:2px;height:2px;background:#FFD60A;border-radius:50%;animation:twinkle 2s infinite alternate}
@keyframes twinkle{0%{opacity:.2}100%{opacity:1}}
.moon{position:absolute;top:20px;left:20px;font-size:30px;filter:drop-shadow(0 0 12px #FFD60A)}
.header{width:100%;text-align:center;padding:10px 20px;z-index:2}
.header h1{color:#FFD60A;font-size:28px;font-weight:900;text-shadow:0 0 18px #FFD60A}
.header p{color:#FFF2A8;font-size:12px;margin-top:2px;font-weight:800;opacity:.8}
.heart-wrap{margin-top:10px;position:relative;width:260px;height:260px;display:flex;align-items:center;justify-content:center;z-index:2}
.heart{width:135px;height:135px;background:#4E0F13;position:relative;transform:rotate(-45deg);box-shadow:0 0 18px rgba(78,15,19,.7), 0 0 0 4px #FFD60A, 0 0 25px rgba(255,214,10,.3);cursor:pointer;transition:transform .1s ease}
.heart:active{transform:rotate(-45deg) scale(0.94)}
.heart::before,.heart::after{content:"";width:135px;height:135px;background:#4E0F13;border-radius:50%;position:absolute}
.heart::before{top:-67px;left:0}
.heart::after{left:67px;top:0}
.heart-text{position:absolute;z-index:3;transform:rotate(45deg);color:#FFD60A;font-weight:900;font-size:22px;text-align:center;top:30%;left:12%;width:76%;line-height:1.1}
.heart-text span{font-size:30px;display:block;margin-top:2px;animation:smallBeat 1.1s infinite;filter:drop-shadow(0 0 10px #FFD60A)}
@keyframes smallBeat{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
.counter{margin-top:12px;background:rgba(255,214,10,.14);border:2px solid #FFD60A;border-radius:18px;padding:9px 18px;color:#FFD60A;font-weight:900;font-size:14px;z-index:2}
.cards{width:90%;max-width:420px;margin:16px auto 0;z-index:2}
.card{background:rgba(255,255,255,.06);border:2px solid rgba(255,214,10,.45);border-radius:20px;padding:12px;margin-bottom:10px;text-align:center}
.card p{color:#FFEC99;font-weight:800;font-size:14px}
.btn{background:#FFD60A;color:#4E0F13;border:none;border-radius:14px;padding:10px 18px;font-weight:900;cursor:pointer;margin:4px}
.btn.dark{background:#4E0F13;color:#FFD60A;border:2px solid #FFD60A}
.floating{position:fixed;bottom:0;font-size:20px;animation:floatUp 3s forwards;pointer-events:none;z-index:10}
@keyframes floatUp{0%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(-90vh) scale(1.4);opacity:0}}
.install{background:#fff;color:#4E0F13;border-radius:20px;padding:12px 16px;margin-top:14px;font-weight:900;display:none;z-index:5;border:none;cursor:pointer}
</style>
</head>
<body>
<div class="stars" id="stars"></div><div class="moon">🌙</div>
<div class="header"><h1>قلب إيلا بليل 🌙</h1><p>منور زي القمر</p></div>
<div class="heart-wrap" onclick="love()"><div class="heart"><div class="heart-text">إيلا<br><span>💛</span></div></div></div>
<div class="counter">✨ <span id="num">0</span> بحبك يا إيلا</div>
<div class="cards"><div class="card"><p id="msg">إيلا حلم حلو بليل 🌙</p></div><div class="card"><button class="btn" onclick="love()">💛 نوري قلب إيلا</button><button class="btn dark" onclick="changeMsg()" رساله من بابا بليل</button></div></div>
<button class="install" id="installBtn">📲 ثبتي برنامج إيلا</button>
<script>
let s=document.getElementById('stars');for(let i=0;i<70;i++){let d=document.createElement('div');d.className='star';d.style.left=Math.random()*100+'vw';d.style.top=Math.random()*100+'vh';d.style.animationDelay=Math.random()*2+'s';s.appendChild(d);}
let n=parseInt(localStorage.getItem('aylaNight')||0);let msgs=["إيلا قمر بليل 🌙💛","إيلا بتنور أوضتها زي النجمة ⭐","تصبحي على خير يا إيلا يا قمر 😴💛","حضن إيلا بيدفي بليل 🤗","نجمة إيلا منورة السما كلها ✨","إيلا حلم حلو بليل 🌙","مامي وبابا بيحبوا إيلا قد النجوم كلها ❤️"];let i=0;document.getElementById('num').innerText=n;
let audioCtx;function iphoneClick(){try{if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();let o=audioCtx.createOscillator();let g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(1200,audioCtx.currentTime);o.frequency.exponentialRampToValueAtTime(50,audioCtx.currentTime+0.08);g.gain.setValueAtTime(0.35,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.12);let f=audioCtx.createBiquadFilter();f.type='highpass';f.frequency.value=800;o.connect(f);f.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+0.12);}catch(e){}}
function love(){n++;localStorage.setItem('aylaNight',n);document.getElementById('num').innerText=n;iphoneClick();if(navigator.vibrate) navigator.vibrate(20);let e=document.createElement('div');e.className='floating';e.innerText=['💛','🌙','⭐','✨','❤️'][Math.floor(Math.random()*5)];e.style.left=Math.random()*80+10+'vw';e.style.bottom='10px';document.body.appendChild(e);setTimeout(()=>e.remove(),3000);}
function changeMsg(){i=(i+1)%msgs.length;document.getElementById('msg').innerText=msgs[i];love();}
const manifest={name:"قلب إيلا  🌙",short_name:"إيلا",start_url:".",display:"standalone",background_color:"#0E0A14",theme_color:"#4E0F13",icons:[{src:"Icon.jpg",sizes:"512x512",type:"image/jpeg"},{src:"Icon.jpg",sizes:"192x192",type:"image/jpeg"}]};
const blob=new Blob([JSON.stringify(manifest)],{type:'application/json'});
document.getElementById('manifestLink').href=URL.createObjectURL(blob);
const sw=`self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('fetch',e=>e.respondWith(fetch(e.request).catch(()=>caches.match(e.request))))`;
if('serviceWorker' in navigator){const swBlob=new Blob([sw],{type:'text/javascript'});navigator.serviceWorker.register(URL.createObjectURL(swBlob));}
let deferredPrompt;let btn=document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;btn.style.display='block';});
btn.addEventListener('click',async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;btn.style.display='none';}});
</script>
</body>
</html>
