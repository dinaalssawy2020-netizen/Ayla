<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قلب إيلا بليل</title>
<link rel="manifest" href="manifest.json">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap');
  body{margin:0;font-family:'Cairo',sans-serif;background:#0a0a1e;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at top,#1a1a3a 0%,#0a0a1e 70%);z-index:-2}
  .stars{position:fixed;inset:0;z-index:-1;pointer-events:none}
  .star{position:absolute;width:2px;height:2px;background:#ffeb8a;border-radius:50%;opacity:.7;animation:twinkle 3s infinite}
  @keyframes twinkle{0%,100%{opacity:.3}50%{opacity:1}}
  .moon{position:absolute;top:25px;left:25px;font-size:32px}
  h1{font-size:32px;margin:10px 0 0;color:#ffcc33}
  .subtitle{font-size:14px;opacity:.8;margin-bottom:20px}
  .heart-box{width:280px;height:260px;background:radial-gradient(ellipse at center,#5a1a1a 0%,#3a0f0f 100%);clip-path:path("M140 230 C 40 140, 0 70, 60 40 C 90 20, 130 20, 140 60 C 150 20, 190 20, 220 40 C 280 70, 240 140, 140 230 Z");display:flex;align-items:center;justify-content:center;animation:pulse 2.5s infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
  .btn-gold{margin-top:18px;padding:12px 28px;border:2px solid #ffcc33;border-radius:30px;background:transparent;color:#ffcc33;font-family:'Cairo';font-weight:700;font-size:16px;cursor:pointer}
  .card{margin-top:14px;width:90%;max-width:360px;padding:14px 18px;border-radius:20px;background:rgba(255,255,255,0.05);border:1px solid #ffcc3344}
  .tabs{display:flex;gap:10px;justify-content:center;margin-top:16px;width:90%;max-width:360px}
  .tab-btn{flex:1;padding:12px;border-radius:20px;border:none;font-family:'Cairo';font-weight:700;cursor:pointer;font-size:14px}
  .tab-btn.active{background:#ffcc33;color:#3a2800}
  .tab-btn:not(.active){background:rgba(255,255,255,0.08);color:#fff;border:1px solid #ffffff22}
  .message-box{display:none;margin-top:14px;width:90%;max-width:360px;padding:18px;border-radius:20px;background:linear-gradient(135deg,#1e1e3a,#2a1a3a);border:1px solid #ffcc3355}
  .message-box.show{display:block}
</style>
</head>
<body>
  <div class="moon">🌙</div>
  <div class="stars" id="stars"></div>
  <h1>🌙 قلب إيلا 
  <div class="subtitle">منور زي القمر</div>
  <div class="heart-box">
    <div>
      <div style="color:#ffcc33;font-size:22px;font-weight:800">إيلا</div>
      <div style="font-size:28px">💛</div>
    </div>
  </div>
  <button class="btn-gold" onclick="addLove()">✨  بحبك يا إيلا</button>
  <div class="card">❤️ مامي وبابا بيحبوا إيلا قد النجوم كلها</div>
  <div class="tabs">
    <button class="tab-btn active" id="btn-light" onclick="showTab('light')">💛 نوري قلب إيلا</button>
    <button class="tab-btn" id="btn-baba" onclick="showTab('baba')"> بابا بعتلك رسالة</button>
  </div>
  <div class="message-box" id="box-light">
    <div>قلب إيلا منور دلوقتي! كل ما تدوسي النور بيزيد حب ✨</div>
  </div>
  <div class="message-box" id="box-baba">
    <div style="font-size:18px;color:#ffcc33;font-weight:800;margin-bottom:8px">رسالة من بابا</div>
    <div style="font-size:16px;line-height:1.8">
   يا إيلا يا قلب بابا يا أحلى نجمة في السما   🌟<br>
  بابا بيحبك قد كل النجوم اللي في السما <br>
      وكل ما بشوف ضحكتك واسمعها قلبي بينور  <br>
      خليكي دايما شطوره و جميلة يا روح بابا 💛
    </div>
  </div>
<script>
  const starsContainer=document.getElementById('stars');
  for(let i=0;i<60;i++){let s=document.createElement('div');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDelay=Math.random()*3+'s';starsContainer.appendChild(s)}
  let count=158;
  function addLove(){count++;document.querySelector('.btn-gold').innerText='✨ '+count+' بحبك يا إيلا';document.querySelector('.heart-box').style.transform='scale(1.15)';setTimeout(()=>document.querySelector('.heart-box').style.transform='scale(1)',200)}
  function showTab(tab){
    document.getElementById('box-light').classList.remove('show');
    document.getElementById('box-baba').classList.remove('show');
    document.getElementById('btn-light').classList.remove('active');
    document.getElementById('btn-baba').classList.remove('active');
    if(tab==='light'){document.getElementById('box-light').classList.add('show');document.getElementById('btn-light').classList.add('active')}
    else{document.getElementById('box-baba').classList.add('show');document.getElementById('btn-baba').classList.add('active')}
  }
  showTab('light');
</script>
</body>
    </html>
