<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قلب إيلا بليل</title>
<link rel="manifest" href="manifest.json">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&display=swap');
*{box-sizing:border-box}
body{margin:0;background:#0d0d1e;color:#ffd452;font-family:'Cairo',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 0 40px;text-align:center;overflow-x:hidden}
.moon{position:absolute;top:18px;left:22px;font-size:34px;filter:drop-shadow(0 0 12px #ffd452)}
.stars{position:fixed;inset:0;pointer-events:none;z-index:-1}
.star{position:absolute;width:2px;height:2px;background:#ffd452;border-radius:50%;opacity:.8}
h1{margin:80px 0 0;font-size:34px;color:#ffcc33;font-weight:800;line-height:1}
.sub{font-size:15px;color:#ffeaa0;opacity:.9;margin:5px 0 20px}
.heart-wrap{position:relative;width:220px;height:220px;display:flex;align-items:center;justify-content:center}
.heart-wrap svg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 10px 20px rgba(0,0,0,.5))}
.heart-content{position:relative;z-index:2;margin-top:18px}
.heart-content div:first-child{font-size:16px;font-weight:800;color:#ffcc33;text-shadow:0 0 10px #ffcc33}
.heart-content div:last-child{font-size:26px;filter:drop-shadow(0 0 12px #ffcc33)}
.btn-outline{margin-top:20px;border:1.8px solid #c9a227;color:#ffcc33;background:transparent;padding:11px 28px;border-radius:30px;font-family:'Cairo';font-weight:700;font-size:15px}
.card{margin-top:14px;width:90%;max-width:360px;border:1.2px solid #3a341e;background:rgba(255,255,255,0.03);border-radius:18px;padding:14px 10px;color:#ffeaa0;font-size:16px;font-weight:700;line-height:1.6}
.bottom{margin-top:12px;width:90%;max-width:360px;border:1.2px solid #3a341e;background:rgba(255,255,255,0.03);border-radius:18px;padding:10px;display:flex;gap:8px}
.baba-btn{flex:1;background:#2a1a1a;color:#ffb3b3;border:1px solid #4a2a2a;border-radius:14px;padding:10px 5px;font-family:'Cairo';font-weight:700;font-size:12px}
.light-btn{flex:1.3;background:#ffcc33;color:#3a2a00;border:none;border-radius:14px;padding:10px;font-family:'Cairo';font-weight:800;font-size:13px}
.msg{width:90%;max-width:360px;margin-top:12px;padding:16px;border-radius:16px;background:#1a1930;border:1px solid #ffcc3344;color:#fff;font-size:14px;line-height:1.8;display:none}
.msg.show{display:block}
.fly{position:fixed;bottom:10px;animation:up 3s forwards;pointer-events:none;z-index:999;font-size:22px}
@keyframes up{to{transform:translateY(-100vh) scale(1.4);opacity:0}}
</style>
</head>
<body>
<div class="moon">🌙</div><div class="stars" id="stars"></div>
<h1>🌙 قلب إيلا بليل 🌙</h1><div class="sub">منور زي القمر</div>
<div class="heart-wrap">
<svg viewBox="0 0 320 300" preserveAspectRatio="none"><path d="M160 270 C 70 180, 10 120, 60 60 C 90 25, 130 25, 160 75 C 190 25, 230 25, 260 60 C 310 120, 250 180, 160 270 Z" fill="#4a1818"/></svg>
<div class="heart-content"><div>إيلا</div><div>💛</div></div>
</div>
<button class="btn-outline" onclick="love()">✨ <span id="cnt">158</span> بحبك يا إيلا</button>
<div class="card">❤️ مامي وبابا بيحبوا إيلا قد النجوم كلها</div>
<div class="bottom"><button class="baba-btn" onclick="showMsg('baba')"> بابا بعتلك رسالة</button><button class="light-btn" onclick="showMsg('light')">💛 نوري قلب إيلا</button></div>
<div id="light" class="msg show">قلب إيلا منور دلوقتي! كل ما تدوسي النور بيزيد حب ✨💛</div>
<div id="baba" class="msg"><div style="color:#ffcc33;font-weight:800;margin-bottom:6px">رسالة من بابا</div> يا إيلا يا قلب بابا يا أحلى نجمة في السما  🌟<br>بابا بيحبك قد كل النجوم اللي في السما و ضحكتك بتنور قلبي زي نور القمر 💛</div>
<script>
let c=158;let stars=document.getElementById('stars');for(let i=0;i<70;i++){let s=document.createElement('div');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.opacity=Math.random();stars.appendChild(s)}
function fly(n){for(let i=0;i<n;i++){let d=document.createElement('div');d.className='fly';d.innerText=['💛','❤️','💖','✨','🌟'][Math.floor(Math.random()*5)];d.style.left=(Math.random()*85+5)+'%';document.body.appendChild(d);setTimeout(()=>d.remove(),3000)}}
function love(){c++;document.getElementById('cnt').innerText=c;fly(14)}
function showMsg(t){document.getElementById('light').classList.remove('show');document.getElementById('baba').classList.remove('show');document.getElementById(t).classList.add('show');fly(t==='baba'?18:8);}
</script>
</body>
</html>
