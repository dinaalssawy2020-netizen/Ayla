<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قلب ايلا الليلي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&family=Amiri:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh;
  background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
  font-family:'Cairo',sans-serif;
  display:flex; align-items:center; justify-content:center;
  padding:20px; overflow:hidden;
}
/* نجوم مضيئة في الخلفية */
.stars{position:fixed; inset:0; pointer-events:none}
.star{
  position:absolute; background:#fff; border-radius:50%;
  animation:twinkle 2s infinite alternate;
  box-shadow:0 0 8px #ffef9c, 0 0 15px #ffef9c;
}
@keyframes twinkle{0%{opacity:.3; transform:scale(.8)}100%{opacity:1; transform:scale(1.2)}}

.card{
  width:360px; max-width:92vw;
  background:rgba(74,26,34,.92);
  backdrop-filter:blur(10px);
  border-radius:40px;
  padding:30px 20px 18px;
  text-align:center;
  border:1px solid rgba(255,239,156,.15);
  box-shadow:0 0 40px rgba(255,204,51,.15);
  position:relative; z-index:2;
}
.moon{position:absolute; top:18px; left:28px; font-size:30px; filter:drop-shadow(0 0 12px #ffef9c)}
.heart{
  font-size:120px; margin:20px 0 10px;
  filter:drop-shadow(0 0 20px #ffef9c) drop-shadow(0 0 50px #ffcc33);
  animation:beat 2s infinite;
  cursor:pointer;
}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.mini{position:absolute; color:#ffef9c; filter:drop-shadow(0 0 6px #ffef9c)}
.m1{top:25px; right:70px; font-size:14px; animation:twinkle 1.5s infinite}
.m2{top:65px; right:30px; font-size:22px; animation:twinkle 2s infinite}
.m3{top:55px; left:90px; font-size:16px; animation:twinkle 2.2s infinite}
.m4{bottom:120px; right:35px; font-size:13px; animation:twinkle 1.8s infinite}

.name{
  font-family:'Amiri',serif; font-size:42px; color:#ffef9c;
  text-shadow:0 0 15px #ffcc33; margin-top:5px;
}
.tabs{display:flex; gap:8px; margin-top:22px; background:rgba(0,0,0,.3); padding:6px; border-radius:16px}
.tab{flex:1; border:none; border-radius:12px; padding:11px 4px; font-family:'Cairo'; font-weight:700; font-size:12px; cursor:pointer}
.tab.active{background:#ffcc33; color:#2a1a1a}
.tab:not(.active){background:transparent; color:#ffcc99; border:1px solid #5a2a33}
.box{margin-top:14px; background:rgba(255,255,255,.07); border:1px solid rgba(255,239,156,.15); border-radius:16px; padding:14px; color:#ffeec0; font-size:13.5px; min-height:60px}
.fly{position:fixed; bottom:10px; z-index:99; pointer-events:none; animation:up 2.3s forwards; font-size:21px}
@keyframes up{to{transform:translateY(-100vh); opacity:0}}
</style>
</head>
<body>
<div class="stars" id="stars"></div>

<div class="card">
  <div class="moon">🌙</div>
  <div class="mini m1">⭐</div><div class="mini m2">⭐</div><div class="mini m3">⭐</div><div class="mini m4">⭐</div>
  <div class="heart" onclick="fly()">💛</div>
  <div class="name">ايلا</div>
  <div class="tabs">
    <button class="tab active" id="b1" onclick="tab('light')">💛 نوري قلب ايلا</button>
    <button class="tab" id="b2" onclick="tab('light')">بابا بعتلك رسالة</button>
  </div>
  <div class="box" id="box">قلب ايلا منور زي القمر بليل 🌙💛</div>
</div>

<script>
// اعملي نجوم مضيئة كتير في السماء
let sBox=document.getElementById('stars')
for(let i=0;i<70;i++){
 let s=document.createElement('div'); s.className='star'
 let size=Math.random()*2+1
 s.style.width=size+'px'; s.style.height=size+'px'
 s.style.left=Math.random()*100+'%'; s.style.top=Math.random()*100+'%'
 s.style.animationDelay=Math.random()*3+'s'
 sBox.appendChild(s)
}
const txts={
 light:"قلب ايلا منور زي القمر بليل 🌙💛 كل النجوم سهرانة عشانك",
 light :"رسالة من بابا<يا ايلا يا قمر بليل 🌙 يا احلى نجمة منورة السما ⭐ بابا بيحبك قد كل النجوم  "
}
function tab(t){
 document.getElementById('b1').classList.toggle('active',t==='light')
 document.getElementById('b2').classList.toggle('active',t==='baba')
 document.getElementById('box').innerHTML=txts[t]
 fly()
}
function fly(){
 let em=['💛','❤️','⭐','🌙']
 let n=4+Math.floor(Math.random()*2)
 for(let i=0;i<n;i++){
  let d=document.createElement('div'); d.className='fly'
  d.innerText=em[Math.floor(Math.random()*4)]
  d.style.left=(Math.random()*80+10)+'%'
  d.style.animationDelay=i*0.12+'s'
  document.body.appendChild(d)
  setTimeout(()=>d.remove(),2300)
 }
}
</script>
</body>
</html>
